<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Information Visualization — Practice Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe6; --paper-2:#ece4d6; --ink:#23201b; --ink-soft:#5b554a;
    --line:#d8cdb8; --accent:#1f6f5c; --accent-d:#15533f; --accent-soft:#dcebe4;
    --gold:#b07a1e; --red:#b23a2e; --red-soft:#f4ddd9; --green:#2e7d4f; --green-soft:#dcefdf;
    --card:#fbf8f1; --shadow:0 1px 0 rgba(0,0,0,.04),0 12px 30px -18px rgba(40,30,10,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, #fbf6ec 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #efe7d6 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Newsreader", Georgia, serif;
    font-size:17px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px; margin:0 auto; padding:28px 20px 90px;}
  header.top{position:relative; padding-bottom:18px; margin-bottom:18px; border-bottom:1.5px solid var(--line);}
  .kicker{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); margin:0 0 6px;}
  h1{font-family:"Fraunces",serif; font-weight:600; font-size:clamp(28px,5vw,42px); line-height:1.02; margin:0; letter-spacing:-.01em;}
  h1 .em{font-style:italic; color:var(--accent-d);}
  .sub{color:var(--ink-soft); margin:8px 0 0; font-size:15px;}

  /* stats */
  .stats{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}
  .stat{flex:1 1 0; min-width:96px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow);}
  .stat .n{font-family:"Fraunces",serif; font-weight:600; font-size:24px; line-height:1;}
  .stat .l{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-top:5px;}
  .stat.correct .n{color:var(--green)} .stat.wrong .n{color:var(--red)} .stat.left .n{color:var(--gold)}
  .bar{height:8px; background:var(--paper-2); border-radius:99px; overflow:hidden; margin-top:14px; border:1px solid var(--line);}
  .bar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--green)); transition:width .4s ease;}

  /* controls */
  .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:16px;}
  select, .btn{
    font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.04em;
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:10px; padding:9px 13px; cursor:pointer; transition:.15s;
  }
  select{padding-right:26px;}
  .btn:hover{border-color:var(--accent); color:var(--accent-d);}
  .btn.solid{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.solid:hover{background:var(--accent-d); color:#fff;}
  .btn.ghost{background:transparent;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card);}
  .seg button{font-family:"IBM Plex Mono",monospace; font-size:12px; border:0; background:transparent; padding:9px 12px; cursor:pointer; color:var(--ink-soft);}
  .seg button.on{background:var(--accent); color:#fff;}

  /* card */
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 22px 18px; box-shadow:var(--shadow); margin-top:18px; animation:rise .35s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  .qhead{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .qnum{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft);}
  .badge{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent-d); background:var(--accent-soft); border:1px solid #bcdccf; padding:3px 8px; border-radius:99px;}
  .badge.type{color:var(--gold); background:#f6ecd7; border-color:#e7d2a6;}
  .qtext{font-family:"Newsreader",serif; font-size:21px; line-height:1.34; margin:2px 0 14px;}
  .qimg{display:block; max-width:100%; height:auto; border:1px solid var(--line); border-radius:12px; margin:0 0 16px; background:#fff;}

  .opts{display:flex; flex-direction:column; gap:9px;}
  .opt{display:flex; gap:11px; align-items:flex-start; border:1.5px solid var(--line); background:var(--paper); border-radius:12px; padding:12px 14px; cursor:pointer; transition:.13s; position:relative;}
  .opt:hover{border-color:var(--accent); background:#fff;}
  .opt .mark{flex:0 0 auto; width:22px; height:22px; border-radius:6px; border:2px solid var(--line); display:grid; place-items:center; margin-top:1px; font-family:"IBM Plex Mono"; font-size:12px; color:var(--ink-soft); background:#fff;}
  .opt.radio .mark{border-radius:99px;}
  .opt .lab{font-size:16.5px; line-height:1.4;}
  .opt.sel{border-color:var(--accent); background:#fff;}
  .opt.sel .mark{background:var(--accent); border-color:var(--accent); color:#fff;}
  .opt.locked{cursor:default;}
  .opt.correct{border-color:var(--green); background:var(--green-soft);}
  .opt.correct .mark{background:var(--green); border-color:var(--green); color:#fff;}
  .opt.bad{border-color:var(--red); background:var(--red-soft);}
  .opt.bad .mark{background:var(--red); border-color:var(--red); color:#fff;}
  .opt .tag{position:absolute; right:12px; top:50%; transform:translateY(-50%); font-family:"IBM Plex Mono"; font-size:10px; letter-spacing:.1em; text-transform:uppercase;}
  .opt.correct .tag{color:var(--green)} .opt.bad .tag{color:var(--red)}

  .foot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .verdict{font-family:"IBM Plex Mono",monospace; font-size:13px; min-height:20px;}
  .verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
  .nav{display:flex; gap:8px;}

  /* overview map */
  .mapwrap{margin-top:26px; border-top:1.5px solid var(--line); padding-top:18px;}
  .mapwrap h2{font-family:"Fraunces"; font-weight:600; font-size:16px; margin:0 0 4px; letter-spacing:.01em;}
  .legend{font-family:"IBM Plex Mono"; font-size:11px; color:var(--ink-soft); display:flex; gap:14px; flex-wrap:wrap; margin:6px 0 12px;}
  .legend i{display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:5px; border:1px solid rgba(0,0,0,.12);}
  .grid{display:flex; flex-wrap:wrap; gap:6px;}
  .cell{width:26px; height:26px; border-radius:6px; border:1px solid var(--line); background:var(--card); font-family:"IBM Plex Mono"; font-size:10px; color:var(--ink-soft); display:grid; place-items:center; cursor:pointer; transition:.1s;}
  .cell:hover{transform:translateY(-2px); border-color:var(--accent);}
  .cell.c{background:var(--green-soft); border-color:#a7d9b9; color:var(--green);}
  .cell.w{background:var(--red-soft); border-color:#e3b3ab; color:var(--red);}
  .cell.cur{outline:2px solid var(--accent); outline-offset:1px;}

  .done{text-align:center; padding:40px 10px;}
  .done h2{font-family:"Fraunces"; font-size:26px; margin:0 0 6px;}
  footer.note{margin-top:34px; font-family:"IBM Plex Mono"; font-size:11px; color:var(--ink-soft); line-height:1.7; border-top:1px solid var(--line); padding-top:14px;}
  @media (max-width:560px){ .stat{min-width:72px} .qtext{font-size:19px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="kicker">Information Visualization · Exam Prep</p>
    <h1>The <span class="em">Practice</span> Deck</h1>
    <p class="sub" id="sub">Loading…</p>
    <div class="stats">
      <div class="stat"><div class="n" id="s-total">0</div><div class="l">In deck</div></div>
      <div class="stat correct"><div class="n" id="s-correct">0</div><div class="l">Correct</div></div>
      <div class="stat wrong"><div class="n" id="s-wrong">0</div><div class="l">Wrong</div></div>
      <div class="stat left"><div class="n" id="s-left">0</div><div class="l">Unanswered</div></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="controls">
      <select id="topic"></select>
      <div class="seg" id="mode">
        <button data-m="all" class="on">All</button>
        <button data-m="wrong">Wrong</button>
        <button data-m="unseen">Unseen</button>
      </div>
      <button class="btn" id="shuffle">⤮ Shuffle</button>
      <button class="btn ghost" id="reset">↺ Reset progress</button>
    </div>
  </header>

  <main id="stage"></main>

  <section class="mapwrap">
    <h2>Question map</h2>
    <div class="legend">
      <span><i style="background:var(--green-soft);border-color:#a7d9b9"></i>Correct</span>
      <span><i style="background:var(--red-soft);border-color:#e3b3ab"></i>Wrong</span>
      <span><i style="background:var(--card)"></i>Not answered</span>
      <span>· tap a number to jump</span>
    </div>
    <div class="grid" id="map"></div>
  </section>

  <footer class="note" id="foot"></footer>
</div>

<script>
const DATA = {"questions": [{"topic": "Foundations", "q": "Among the two visualizations below (created from the same dataset), is there one visualization that is naturally better than the other?", "options": [["True", false], ["False", true]], "type": "single", "img": "line_heat", "id": 1}, {"topic": "Foundations", "q": "How does visualization help human cognition? (Select all that apply)", "options": [["It increases our capacity to remember", true], ["It helps patterns to be detected", true], ["It removes the need for statistical analysis", false], ["It guarantees a single objective interpretation", false], ["It permanently stores the raw dataset for you", false]], "type": "multi", "img": null, "id": 2}, {"topic": "Foundations", "q": "We create visualizations exclusively to tell stories about the data.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 3}, {"topic": "Foundations", "q": "Given a set of data, there is a unique way to correctly represent the data in a visual way.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 4}, {"topic": "Foundations", "q": "A visualization can never tell a misleading story, because for a certain type of data there is a unique type of visualization that can be created.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 5}, {"topic": "Foundations", "q": "Geospatial data can only be represented by a single type of system (and projection).", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 6}, {"topic": "Foundations", "q": "In the definition adopted for information visualization in this course, what is the major goal of visualization?", "options": [["To help humans understand and reason about the data", true], ["To make the data look as beautiful as possible", false], ["To replace statistical analysis entirely", false], ["To compress the data into the fewest possible numbers", false], ["To produce the most colorful chart possible", false]], "type": "single", "img": null, "id": 7}, {"topic": "Foundations", "q": "What is typically the FIRST step in the construction of a visual representation of the data?", "options": [["The choice of the coordinate system", true], ["Choosing the title and the legend", false], ["Picking the color palette", false], ["Collecting more data", false], ["Deciding the file export format", false]], "type": "single", "img": null, "id": 8}, {"topic": "Foundations", "q": "Typically, how many different properties (and which) are represented in visualizations?", "options": [["Two properties mapped into positions. Using other mappings, although used, should be avoided as it becomes hard to understand the visualization", true], ["Exactly one property mapped to color", false], ["As many as possible, the more dimensions the better", false], ["Three properties always mapped to x, y, and shape", false], ["Four properties, one per axis plus one per color channel", false]], "type": "single", "img": null, "id": 9}, {"topic": "Foundations", "q": "Select the activities directly related to visualization. (Select all that apply)", "options": [["Data transformation", true], ["The creation of a graphical representation", true], ["The selection of visual representation", true], ["Collecting the raw data in the field", false], ["Peer-reviewing someone else's paper", false]], "type": "multi", "img": null, "id": 10}, {"topic": "Foundations", "q": "Richard Hamming said \"The purpose of computing is insight, not numbers.\" Helping humans to discover the story and to get insight from data is the ONLY reason why we create visualizations.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 11}, {"topic": "Scales & Coordinates", "q": "What are the problems with the square-root scale?", "options": [["Less clear grid spacing in the axis in comparison to other scales like a log-scale", true], ["It cannot represent any negative numbers", false], ["It is only defined for integer values", false], ["It distorts categorical variables", false], ["It always reverses the order of the data", false]], "type": "single", "img": null, "id": 12}, {"topic": "Scales & Coordinates", "q": "Polar coordinates and complex numbers have a natural relationship.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 13}, {"topic": "Scales & Coordinates", "q": "When should you adopt log scales? (Select all that apply)", "options": [["Datasets with a large skewness", true], ["Datasets composed of multiplicative factors", true], ["Datasets that contain only negative values", false], ["Small datasets with very few points", false], ["Datasets that are perfectly uniform", false], ["Datasets with only two data points", false]], "type": "multi", "img": null, "id": 14}, {"topic": "Scales & Coordinates", "q": "What type of data is good to represent with polar coordinates? (Select all that apply)", "options": [["Angular data", true], ["Data containing periodic patterns", true], ["Plain categorical text labels", false], ["Geospatial elevation data", false], ["Long free-text comments", false], ["Unordered categorical labels", false]], "type": "multi", "img": null, "id": 15}, {"topic": "Scales & Coordinates", "q": "What is true about the uniqueness of scales?", "options": [["Scales serve the purpose of mapping data onto aesthetics via some mathematical transformation that is not unique", true], ["Each dataset has exactly one valid scale", false], ["Scales are always linear", false], ["Scales only apply to color, never to position", false], ["Each aesthetic can only ever use a linear scale", false]], "type": "single", "img": null, "id": 16}, {"topic": "Scales & Coordinates", "q": "The hyperbolic arcsin scale is good because:", "options": [["It is like a log for big numbers and it has no problems with zeros", true], ["It always turns curves into perfectly straight lines", false], ["It only works for percentages", false], ["It removes the need to choose any parameters", false], ["It guarantees the y-axis starts at zero", false]], "type": "single", "img": null, "id": 17}, {"topic": "Scales & Coordinates", "q": "In a cartesian coordinate system, when you have axes representing the same units, you can use arbitrary aspect ratios.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 18}, {"topic": "Scales & Coordinates", "q": "Coordinate systems in the context of visualization are: (Select all that apply)", "options": [["Continuous or discretized", true], ["Responsible for defining where data values are located in the visual representation", true], ["Always cartesian", false], ["Only relevant to 3D plots", false], ["Always three-dimensional", false], ["Only meaningful for time series", false]], "type": "multi", "img": null, "id": 19}, {"topic": "Aesthetics", "q": "Aesthetics are maps that are uniquely tied to certain types of data. Each type of data requires the adoption of a single type of aesthetics.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 20}, {"topic": "Aesthetics", "q": "Shapes and line-type aesthetics are better adapted to be used with continuous data.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 21}, {"topic": "Aesthetics", "q": "If you have multiple categories in a dataset, is it important to choose the order in which the categorical variables are mapped into aesthetics?", "options": [["Yes, it is very important, because different maps will reveal different patterns", true], ["No, the order never changes anything", false], ["Only when there are exactly two categories", false], ["Only for continuous variables", false], ["Yes, but only to make the chart more colorful", false]], "type": "single", "img": null, "id": 22}, {"topic": "Aesthetics", "q": "If the data has a natural order, you must respect that natural order in the visualization in most cases (unless a stronger pattern serves the story or discovery).", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 23}, {"topic": "Colors", "q": "In the figure below, each row corresponds to a color scale. Match each row (a, b, c, d) to its correct type.", "options": [["a = Qualitative, b = Divergent, c = Accent, d = Sequential", true], ["a = Sequential, b = Qualitative, c = Divergent, d = Accent", false], ["a = Divergent, b = Accent, c = Sequential, d = Qualitative", false], ["a = Accent, b = Sequential, c = Qualitative, d = Divergent", false], ["a = Sequential, b = Accent, c = Divergent, d = Qualitative", false]], "type": "single", "img": "colorscales", "id": 24}, {"topic": "Colors", "q": "A qualitative color scale can have an impression of order, after all, there are qualitative variables that can be ordered.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 25}, {"topic": "Colors", "q": "A qualitative color scale can have an infinite amount of different colors.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 26}, {"topic": "Colors", "q": "Colors are usually preferred to shapes to highlight important features/classes in the data during a visualization.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 27}, {"topic": "Colors", "q": "Sequential color scales are the only way to use colors as an additional dimension in a visualization.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 28}, {"topic": "Colors", "q": "Colors are important for visualization. Why? (Select all that apply)", "options": [["Colors can be used as an additional dimension and map actual values of the data", true], ["Colors can be used to highlight and call attention to some aspects of the representation", true], ["Color can be used to distinguish classes and/or groups", true], ["Colors make the data file smaller", false], ["They reduce the number of data points you need", false]], "type": "multi", "img": null, "id": 29}, {"topic": "Colors", "q": "What are the different types of color scales? (Select all that apply)", "options": [["Sequential color scale", true], ["Divergent color scale", true], ["Accent color scale", true], ["Qualitative color scale", true], ["Logarithmic color scale", false], ["Polar color scale", false], ["Cartesian color scale", false], ["Periodic color scale", false]], "type": "multi", "img": null, "id": 30}, {"topic": "Colors", "q": "Divergent color scales need a well-defined mid-point, and this mid-point usually needs to stand out, regardless of whether it is weaker or stronger than the rest of the scale.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 31}, {"topic": "Colors", "q": "Why is it important for a sequential color scale to be perceptually uniform and smoothly varying?", "options": [["Because it allows easier interpretation of distances in the original data from the distances in colors", true], ["Because it makes the plot render faster", false], ["Because it guarantees colorblind safety automatically", false], ["Because it is required for categorical data", false], ["Because it lets you use fewer total colors", false]], "type": "single", "img": null, "id": 32}, {"topic": "Amounts & Bars", "q": "The visualization below is...", "options": [["Bad, because the y-axis does not start at zero", true], ["Good, it is a clear and fair comparison", false], ["Bad, because it uses too many colors", false], ["Good, because the y-axis is correctly truncated", false], ["Bad, because it should have used a log scale", false]], "type": "single", "img": "bush", "id": 33}, {"topic": "Amounts & Bars", "q": "What is bad about this visualization?", "options": [["The x-axis is ordered by bar size, and since there is a natural ordering in the data, it is hard to see the trends", true], ["The bars are too colorful", false], ["The y-axis does not start at zero", false], ["It should have used horizontal bars", false], ["It mixes two different units on a single axis", false]], "type": "single", "img": "income", "id": 34}, {"topic": "Amounts & Bars", "q": "The visualization below is...", "options": [["Good, because the horizontal alignment helps to read and understand the visualization", true], ["Bad, because the y-axis does not start at zero", false], ["Bad, because bars should always be vertical", false], ["Good, but it should have been a pie chart", false], ["Bad, because it has no gridlines", false]], "type": "single", "img": "starwars", "id": 35}, {"topic": "Amounts & Bars", "q": "When should you adopt dot plots in place of bar charts?", "options": [["When there is a good reason to start the chart at a value different from zero", true], ["When you have only a single category", false], ["When the data is purely textual", false], ["Never, dot plots are always worse", false], ["When you want to emphasize the total sum", false]], "type": "single", "img": null, "id": 36}, {"topic": "Amounts & Bars", "q": "How can you create a visualization in ggplot2 that has an inverted x- and y-axis as in the example below?", "options": [["Usage of coord_flip()", true], ["Usage of invert_axes()", false], ["Usage of flip_xy()", false], ["Usage of coord_polar()", false], ["Usage of theme(flip = TRUE)", false]], "type": "single", "img": "dose", "id": 37}, {"topic": "Amounts & Bars", "q": "When should heatmaps be adopted? (Select all that apply)", "options": [["When you have at least two categories and one continuous value to represent visually", true], ["When the dataset contains large amounts of data", true], ["When you only have a single data point", false], ["When the data is purely textual labels", false], ["When you have a single numeric value", false], ["When the data is purely textual labels and nothing else", false]], "type": "multi", "img": null, "id": 38}, {"topic": "Amounts & Bars", "q": "To visualize amounts, one normally adopts which types of visualizations? (Select all that apply)", "options": [["Bar plots", true], ["Heatmaps", true], ["Stacked bars", true], ["Dot plots", true], ["Violin plots", false], ["Q-Q plots", false], ["Connected scatterplots", false]], "type": "multi", "img": null, "id": 39}, {"topic": "Amounts & Bars", "q": "How can you create a visualization in ggplot2 using grouped bars?", "options": [["By setting the fill option in aes() and setting position=\"dodge\" in geom_bar()", true], ["By setting position=\"stack\" in geom_bar()", false], ["By calling geom_grouped_bar()", false], ["By using facet_wrap() on each group", false], ["By using geom_bar() with stat = \"grouped\"", false]], "type": "single", "img": null, "id": 40}, {"topic": "Amounts & Bars", "q": "How do you visualize data using a stacked bar plot in ggplot2?", "options": [["Using geom_col() and setting the position parameter to \"stack\"", true], ["Using geom_col() and setting position=\"dodge\"", false], ["Using geom_stack()", false], ["Using coord_flip() on a dot plot", false], ["By using geom_bar() with position = \"fill\" only", false]], "type": "single", "img": null, "id": 41}, {"topic": "Amounts & Bars", "q": "When is using stacked bars useful?", "options": [["When the sum of the amounts conveys some meaningful information", true], ["Always, in every situation", false], ["Only when there is a single category", false], ["When you need precise comparison of time series", false], ["When you need to read each segment's exact value precisely", false]], "type": "single", "img": null, "id": 42}, {"topic": "Relations", "q": "To visualize relations between variables, one normally adopts which types of visualizations? (Select all that apply)", "options": [["Correlograms", true], ["Bubble charts", true], ["Scatter plots", true], ["Density contours", true], ["Pie charts", false], ["Choropleths", false], ["Treemaps", false]], "type": "multi", "img": null, "id": 43}, {"topic": "Proportions",  that uses a circle divided into sections to represent numbers that do not necessarily need to add up to a whole.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 50}, {"topic": "Proportions", "q": "Pie charts are a modern type of visualization, and this is one of the reasons why we see them so much in the media.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 51}, {"topic": "Proportions", "q": "Stacked bars are a bad way to visualize the time evolution of proportions when there are multiple classes (more than two).", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 52}, {"topic": "Proportions", "q": "Treemaps and Mosaic plots are the same thing.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 53}, {"topic": "Proportions", "q": "Treemaps and Mosaic plots share the approach that is used to split the rectangles.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 54}, {"topic": "Proportions", "q": "Mosaic plots and treemaps have similar limitations as stacked bars: due to the lack of shared baselines, it is hard to obtain precise numerical insight from them.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 55}, {"topic": "Proportions", "q": "Treemaps adopt nested rectangles to represent proportions of multiple categories at once, and frequently colors are adopted to aid interpretation by grouping one of the categorical dimensions.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 56}, {"topic": "Proportions", "q": "When representing data using parallel sets, the ordering of the categorical variables is irrelevant — any order tells the same story, so you do not need to organize the variables.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 57}, {"topic": "Proportions", "q": "How do you build treemaps in ggplot2?", "options": [["It cannot be done from baseline ggplot2, but you can import treemapify and use geom_treemap()", true], ["By using geom_treemap() in base ggplot2", false], ["By using coord_polar() on a bar chart", false], ["By using stat_tree()", false], ["By using coord_treemap() on geom_bar()", false]], "type": "single", "img": null, "id": 58}, {"topic": "Proportions", "q": "How do you build Mosaic plots in ggplot2?", "options": [["It is not simple, but you can combine geom_bar() with facets", true], ["By using geom_mosaic() in base ggplot2", false], ["By using coord_flip()", false], ["By using only geom_tile()", false], ["By using geom_mosaic() from the base package", false]], "type": "single", "img": null, "id": 59}, {"topic": "Proportions", "q": "Multi-panel plots (e.g. of density distributions) are a good technique to represent proportions. However, they only work for a small number of categories, since many panels make interpretation cumbersome.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 60}, {"topic": "Proportions", "q": "When is visualizing proportions important?", "options": [["To visualize how groups or amounts split into pieces that sum to a whole", true], ["To discover trends over time", false], ["To represent angular data", false], ["To smooth noisy data", false], ["To smooth out a noisy time series", false]], "type": "single", "img": null, "id": 61}, {"topic": "Distributions", "q": "What is wrong with this histogram? (Select all that apply)", "options": [["It is showing data where there is obviously no data", true], ["The bins are too narrow (there should be fewer bins for the visualization to be adequate)", true], ["The bins are too wide (there should be more bins)", false], ["The y-axis does not start at zero", false], ["The colors are misleading", false], ["It uses a log scale by mistake", false]], "type": "multi", "img": "histogram", "id": 62}, {"topic": "Distributions", "q" es along the x-axis the same way?", "options": [["No, because the distributions would start to superpose and, beyond hiding information, this would make the visualization unreadable", true], ["Yes, ridgelines scale to any number of categories on either axis", false], ["Yes, as long as you use enough distinct colors", false], ["No, ridgelines can only ever show a single distribution", false], ["Yes, by stacking them along a third (z) axis", false]], "type": "single", "img": "ridgelines", "id": 67}, {"topic": "Distributions", "q": "Cumulative Density is the most historically and widely used way of visualizing distributions.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 68}, {"topic": "Distributions", "q": "For datasets containing a small number of points, kernel density estimators are better than histograms.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 69}, {"topic": "Distributions", "q": "There is no way to choose a reasonable kernel width when using a kernel density estimator; you always need to just experiment with trial and error.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 70}, {"topic": "Distributions", "q": "What are some of the problems with histograms and density plots? (Select all that apply)", "options": [["They depend on user-selected parameters", true], ["They result from the interpretation of the data", true], ["They cannot be drawn in ggplot2", false], ["They require negative values to work", false], ["They can only show integer data", false], ["They cannot use color", false]], "type": "multi", "img": null, "id": 71}, {"topic": "Distributions", "q": "Empirical cumulative distribution functions and quantile-quantile plots are more faithful representations of the data, but are not so widely used because they are harder to interpret.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 72}, {"topic": "Distributions", "q": "When you create an empirical cumulative distribution function visualization, you always need to use ascending order.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 73}, {"topic": "Distributions", "q": "For any number of multiple distributions, visualizing a very large number of independent plots is always a good option.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 74}, {"topic": "Distributions", "q": "A good way to visualize two distributions at the same time and compare them is to use histograms that are rotated and mirrored.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 75}, {"topic": "Distributions", "q": "To visualize multiple distributions at the same time, a good technique is to adopt overlapping DENSITY plots with transparency in the filling colors.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 76}, {"topic": "Distributions", "q": "To visualize multiple distributions at the same time, a good technique is to adopt overlapping HISTOGRAMS with transparency in the filling color.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 77}, {"topic": "Distributions", "q": "Box plots are a very important type of visual abstraction for distributions. Their representation allows you to easily distinguish the existence of bimodality in the data.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 78}, {"topic": "Distributions", "q": "Boxplots do not hide information, and that is why they are so important in information visualization.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 79}, {"topic": "Distributions", "q": "Strip charts do not work if the dataset is too large because, even with jittering, all the points would end up overplotting and any feature of the distributions would disappear.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 80}, {"topic": "Distributions", "q": "How can you create violin plots in ggplot2?", "options": [["By using the geom_violin() call", true], ["By using geom_density() with coord_polar()", false], ["By using geom_boxplot()", false], ["By using stat_violin()", false], ["By using geom_density() with coord_flip()", false]], "type": "single", "img": null, "id": 81}, {"topic": "Distributions", "q": "A histogram requires no parameters to be set, and this is why it is one of the most widely used visual abstractions of distributions.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 82}, {"topic": "Distributions", "q": "Which are some standard geometrical mappings to visualize distributions? (Select all that apply)", "options": [["Histograms", true], ["Density plots", true], ["Pie charts", false], ["Treemaps", false], ["Choropleths", false], ["Mosaic plots", false]], "type": "multi", "img": null, "id": 83}, {"topic": "Distributions", "q": "To visualize distributions, one normally adopts which types of visualizations? (Select all that apply)", "options": [["Sina plots", true], ["Boxplots", true], ["Strip charts", true], ["Pie charts", false], ["Choropleths", false], ["Bubble charts", false]], "type": "multi", "img": null, "id": 84}, {"topic": "Distributions", "q": "How do you create empirical cumulative distribution function plots in ggplot2?", "options": [["Simply using the stat_ecdf() call", true], ["Using geom_ecdf()", false], ["Using cumsum() inside geom_line()", false], ["Using stat_cumulative()", false], ["By using geom_step() on the raw data with no stat", false]], "type": "single", "img": null, "id": 85}, {"topic": "Distributions", "q": "If you have multiple distributions to visualize at the same time, kernel density estimator visualizations are always to be preferred to histograms, as they are easier to interpret in this context.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 86}, {"topic": "Distributions", "q": "Ridgelines are just multiple density plots that are shifted along the y-axis.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 87}, {"topic": "Distributions", "q": "Ridgeline is a type of representation that can be adopted even with a very large number of distributions, such as several hundreds of independent distributions.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 88}, {"topic": "Distributions", "q": "To visualize a large number of distributions at the same time, it is possible to use violin plots and box plots, although there are other options as well.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 89}, {"topic": "Distributions", "q": "When adopting ridgelines as a visual abstraction, one of the major objectives is to allow detailed quantitative comparison between the distributions.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 90}, {"topic": "Distributions", "q": "Stacked histograms are always a good way to visualize multiple distributions because they are intuitive and easy to read.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 91}, {"topic": "Distributions", "q": "Sinaplots are a relatively new way to visually represent distributions by combining slightly altered strip charts and violin plots.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 92}, {"topic": "Distributions", "q": "The only geometrical mappings that can be adopted when visualizing multiple distributions are boxplots and violin plots.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 93}, {"topic": "Distributions", "q": "The only procedure for creating bins in a histogram requires you to first divide the data interval, then count how many values fall in each interval, and finally divide by the total number of points.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 94}, {"topic": "Distributions", "q": "Computing a kernel density estimator requires you to replace each point in the dataset with a gaussian function of fixed width. No other function can be used.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 95}, {"topic": "Distributions", "q": "Cumulative density visual representations have no arbitrary parameter choices.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 96}, {"topic": "Distributions", "q": "Cumulative density visual representations only show aggregations of the data, but not the actual data points.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 97}, {"topic": "Distributions", "q": "Between histograms and kernel density estimators, both are equally effective at communicating data to the general public.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 98}, {"topic": "Distributions", "q": "Why are quantile-quantile plots used?", "options": [["To determine whether data follow a certain distribution or not", true], ["To compute the mean of the data", false], ["To represent proportions of a whole", false], ["To display geospatial data", false], ["To remove outliers from the dataset", false]], "type": "single", "img": null, "id": 99}, {"topic": "Distributions", "q": "How do you create quantile-quantile plots in ggplot2?", "options": [["By using the stat_qq() call", true], ["By using geom_qq_only()", false], ["By using stat_quantile()", false], ["By using geom_density()", false], ["By using geom_quantile()", false]], "type": "single", "img": null, "id": 100}, {"topic": "Distributions", "q": "Density plots created from kernel density estimators were not widely used historically (especially before computers) because they are computationally heavy to construct.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 101}, {"topic": "Distributions", "q": "When is visualizing distributions important?", "options": [["To visualize the relative frequency of the measures/numbers appearing in the dataset", true], ["To represent how parts sum to a whole", false], ["To map geospatial coordinates", false], ["To show angular periodic data", false], ["To represent how parts make up a whole", false], ["To map geographic regions", false]], "type": "single", "img": null, "id": 102}, {"topic": "Trends & Time", "q": "Scatter plots are good tools to discover trends in datasets.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 103}, {"topic": "Trends & Time", "q": "Scatter plots represent all the data in a dataset as individual points in the selected dimensions.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 104}, {"topic": "Trends & Time", "q": "Correlograms are good representations for a large number of dimensions.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 105}, {"topic": "Trends & Time", "q": "Dimensionality reduction techniques applied to visualization are only as useful as there are correlated variables in a dataset.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 106}, {"topic": "Trends & Time", "q": "A slope graph can only compare two measurements (two dimensions) at a time.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 107}, {"topic": "Trends & Time", "q": "A connected scatter plot uses time on the x (or y) axis, while the other two variables are mapped to the y (or x) axis and the line color.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 108}, {"topic": "Trends & Time", "q": "When using a line graph to visualize a time series, the lines represent actual data.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 109}, {"topic": "Trends & Time", "q": "In a connected scatterplot, the time dimension does not need to be made explicit, as it is always easy to interpret the plot and discover the time direction.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 110}, {"topic": "Trends & Time", "q": "In visualizations, time is just a variable like any other, without any particularity.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 111}, {"topic": "Trends & Time", "q": "How do you build line graphs in ggplot2?", "options": [["Using geom_line() and adding geom_point()", true], ["Using geom_timeseries()", false], ["Using only geom_path()", false], ["Using coord_flip()", false], ["Using geom_col() and adding a trend line", false]], "type": "single", "img": null, "id": 112}, {"topic": "Trends & Time", "q": "How do you build line graphs that are filled under the curve in ggplot2?", "options": [["By using geom_ridgeline() and setting height=count and y=0", true], ["By always using geom_area()", false], ["By using geom_fill()", false], ["By using coord_polar()", false], ["By setting fill = TRUE inside geom_line()", false]], "type": "single", "img": null, "id": 113}, {"topic": "Trends & Time", "q": "A widely used technique to emphasize the major trend in a line graph is to fill the entire area under the curve.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 114}, {"topic": "Trends & Time", "q": "How do you build correlograms in ggplot2?", "options": [["Using geom_tile() or geom_point() with the correct mapping of colors and sizes; but the correlations must be computed outside ggplot", true], ["Using geom_correlogram()", false], ["By calling cor() inside aes()", false], ["Using stat_corr()", false], ["By using geom_smooth(method = \"cor\")", false]], "type": "single", "img": null, "id": 115}, {"topic": "Trends & Time", "q": "How can you build pair plots in ggplot2?", "options": [["It is not possible from baseline ggplot2, but you can use ggpairs() from the GGally library", true], ["By using geom_pairs()", false], ["By using facet_grid()", false], ["By using stat_pairs()", false], ["By using facet_wrap() over every variable pair", false]], "type": "single", "img": null, "id": 116}, {"topic": "Trends & Time", "q": "Bubble charts are scatter plots with varying glyph sizes.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 117}, {"topic": "Trends & Time", "q": "How do you create bubble plots in ggplot2?", "options": [["Using geom_point() and setting the size aesthetic", true], ["Using geom_bubble()", false], ["Using geom_point() and setting alpha", false], ["Using coord_polar()", false], ["Using geom_count()", false]], "type": "single", "img": null, "id": 118}, {"topic": "Trends & Time", "q": "When creating bubble charts it is never necessary to use scale discretization for the variable mapped to glyph size, as the eye easily interprets continuous sizes.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 119}, {"topic": "Trends & Time", "q": "Scatter plots are a type of visual representation that formally exists since Greek times.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 120}, {"topic": "Trends & Time", "q": "Scatterplots were first invented to be used in Astronomy.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 121}, {"topic": "Trends & Time", "q": "When visualizing multiple time series in the same representation, scatterplots should be avoided because the information is confusing even with different shapes and colors.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 122}, {"topic": "Trends & Time", "q": "When multiple variables and multiple time series need to be visualized, a common representation is creating two or more separate line graphs sharing the same time axis.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 123}, {"topic": "Trends & Time", "q": "Is one of these two visualizations naturally better than the other?", "options": [["No, both are good visualizations and the choice depends on the story and the audience", true], ["Yes, the connected scatterplot is always better", false], ["Yes, the two separate line graphs are always better", false], ["No, both are bad visualizations", false], ["Yes, but only when the audience is technical", false]], "type": "single", "img": "twolines", "id": 124}, {"topic": "Smoothing", "q": "Select only the possible techniques adopted to smooth visualizations. (Select all that apply)", "options": [["Splines", true], ["Kalman filter", true], ["Moving average", true], ["Random shuffling of points", false], ["Pie slicing", false], ["Stacking the series", false], ["Discretizing the axis", false]], "type": "multi", "img": null, "id": 125}, {"topic": "Smoothing", "q": "When computing a moving average for a visualization, you always need to calculate a MEAN of the points inside the window; you cannot use other summary statistics.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 126}, {"topic": "Smoothing", "q": "Statisticians, scientists, and financial analysts always represent moving-average smooth curves in the same way.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 127}, {"topic": "Smoothing", "q": "How does smoothing help the perception of trends while visualizing data?", "options": [["It combines data points into a non-parametric function, capturing large patterns in the data", true], ["It deletes the noisy data points permanently", false], ["It converts the data into a pie chart", false], ["It forces the data into a straight line", false], ["It replaces all the data with a single average value", false]], "type": "single", "img": null, "id": 128}, {"topic": "Smoothing", "q": "What are some standard strategies to visualize trends in low-dimensional data? (Select all that apply)", "options": [["Adopting smoothing", true], ["Performing model fitting", true], ["Removing all data points", false], ["Using pie charts", false], ["Discretizing the time axis", false], ["Converting to a pie chart", false]], "type": "multi", "img": null, "id": 129}, {"topic": "Smoothing", "q": "Detrending a dataset for visualization is done by simply subtracting the major trend from the data.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 130}, {"topic": "Smoothing", "q": "How do you create spline smoothing in ggplot2?", "options": [["By using geom_smooth(method=\"gam\") and setting the formula to the type of spline", true], ["By using geom_spline()", false], ["By using geom_smooth(method=\"lm\")", false], ["By using stat_spline()", false], ["By using geom_smooth(method = \"loess\")", false]], "type": "single", "img": null, "id": 131}, {"topic": "Smoothing", "q": "How do you do smoothing with loess in ggplot2?", "options": [["By calling geom_smooth(method=\"loess\")", true], ["By calling geom_loess()", false], ["By calling geom_smooth(method=\"gam\")", false], ["By calling stat_loess()", false], ["By using stat_smooth() with no method set", false]], "type": "single", "img": null, "id": 132}, {"topic": "Smoothing", "q": "LOESS (locally estimated scatterplot smoothing) can be employed in datasets of any size, even very large ones.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 133}, {"topic": "Smoothing", "q": "If the data is exponential, it is better to perform a linear fit in a log-transformed space than to perform a non-linear fit in the original space.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 134}, {"topic": "Spatial Data", "q": "Techniques to visualize spatial data can only be used with data obtained from the surface of the Earth.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 135}, {"topic": "Spatial Data", "q": "In the visualization of spatial data, it is necessary to always adopt multiple layers (more than 2).", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 136}, {"topic": "Spatial Data", "q": "When using a choropleth, it is not possible to adopt colormaps that map dark colors to low values and bright colors to high values.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 137}, {"topic": "Spatial Data", "q": "When using layers in spatial data visualization, layers are used to convey different types of information.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 138}, {"topic": "Spatial Data", "q": "Any type of dataset can be used together with spatial visualization techniques.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 139}, {"topic": "Spatial Data", "q": "The Mercator projection has existed since ancient Greek times, and it is a conformal projection that rolls the globe into a cylinder and then unrolls it onto a plane.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 140}, {"topic": "Spatial Data", "q": "The visualization below is perfectly fine.", "options": [["True", false], ["False", true]], "type": "single", "img": "map", "id": 141}, {"topic": "Spatial Data", "q": "When visualizing spatial data, some type of projection is always required.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 142}, {"topic": "Spatial Data", "q": "It is possible to define a projection of geospatial data into a plane that does not introduce any distortion.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 143}, {"topic": "Spatial Data", "q": "Cartograms are a visual representation of spatial data that is always geographically accurate.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 144}, {"topic": "Spatial Data", "q": "A conformal projection is a projection that preserves areas.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 145}, {"topic": "Spatial Data", "q": "What are some standard techniques that can be adopted with spatial data? (Select all that apply)", "options": [["Cartograms", true], ["Choropleths", true], ["Violin plots", false], ["Q-Q plots", false], ["Ridgelines", false]], "type": "multi", "img": null, "id": 146}, {"topic": "Spatial Data", "q": "To create a cartogram in ggplot2, you need to use which approach?", "options": [["Distort the data outside ggplot2 and use a simple shape visualization with geom_sf()", true], ["Use geom_cartogram() directly", false], ["Use only coord_map()", false], ["Use stat_distort()", false], ["By using coord_map() with a distortion factor", false]], "type": "single", "img": null, "id": 147}, {"topic": "Uncertainty", "q": "The representation of uncertainty should be taken very seriously, since (1) it is important to convey that data is uncertain when telling a story, and (2) it is important to see uncertainty when discovering a pattern.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 148}, {"topic": "Uncertainty", "q": "The usage of eyes in a visualization serves the purpose of representing the distribution of the data itself, NOT the uncertainty associated with the data.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 149}, {"topic": "Uncertainty", "q": "The most common way to represent uncertainty in visualizations is by using error bars.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 150}, {"topic": "Uncertainty", "q": "What are some standard strategies to visualize uncertainty? (Select all that apply)", "options": [["Using animations", true], ["Error bars", true], ["Confidence bands", true], ["Pie charts", false], ["Removing the outliers", false], ["Sorting the data in ascending order", false], ["Removing the legend", false]], "type": "multi", "img": null, "id": 151}, {"topic": "Uncertainty", "q": "Error bars are self-describing, so it is always possible to know what they represent (standard deviation, standard error, confidence intervals, etc.).", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 152}, {"topic": "Uncertainty", "q": "Graded error bars help avoid interpretability errors because they clearly show the different confidence levels.", "options": [["True", true], ["False", false]], "type": "single", "img": null, "id": 153}, {"topic": "Uncertainty", "q": "How do you create graded error bars in ggplot2?", "options": [["By creating several error bars with different colors", true], ["By using geom_errorbar_graded()", false], ["By using a single thick error bar", false], ["By using coord_flip()", false], ["By using geom_errorbar() with a single fixed width", false]], "type": "single", "img": null, "id": 154}, {"topic": "Uncertainty", "q": "How do you visualize model uncertainties in ggplot2?", "options": [["Calling geom_ribbon()", true], ["Calling geom_uncertainty()", false], ["Calling geom_error()", false], ["Calling stat_confidence()", false], ["Calling geom_smooth() with se = FALSE", false]], "type": "single", "img": null, "id": 155}, {"topic": "Uncertainty", "q": "In a visualization using error bars, two samples with the same standard deviation but different sample sizes will have error bars of the same size IF the error bars represent standard errors.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 156}, {"topic": "Uncertainty", "q": "Quantile dotplots are a bad representation of a probability distribution because it is hard to count the shapes and arrive at numerical estimates, and they sacrifice mathematical accuracy.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 157}, {"topic": "Uncertainty", "q": "The techniques adopted to visualize Bayesian statistical inferences and frequentist statistical inferences are very different.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 158}, {"topic": "Uncertainty", "q": "Research in human perception indicates that we are better at perceiving continuous objects than discrete objects, and this is why violins are an optimal choice to visualize uncertainties.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 159}, {"topic": "Uncertainty", "q": "When visualizing the uncertainty of a linear model fit (a straight line), the confidence bands will be a continuously linear interval around the best fit.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 160}, {"topic": "Proportional Ink & 2D", "q": "Density contours can be adopted to visualize very large datasets and work well regardless of the behavior of your data.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 161}, {"topic": "Proportional Ink & 2D", "q": "In ggplot2, how can you create a 2D density contour?", "options": [["By using geom_density_2d()", true], ["By using geom_contour2d()", false], ["By using stat_density()", false], ["By using geom_tile()", false], ["By using geom_contour() on the raw points", false]], "type": "single", "img": null, "id": 162}, {"topic": "Proportional Ink & 2D", "q": "In ggplot2, how do you create 2D histograms?", "options": [["By using geom_bin2d", true], ["By using geom_hist2d()", false], ["By using geom_histogram() with two aesthetics", false], ["By using stat_2d()", false], ["By using geom_raster() directly", false]], "type": "single", "img": null, "id": 163}, {"topic": "Proportional Ink & 2D", "q": "If you have the choice, it is always better to use hexagons to create 2D histograms, because they provide a more accurate representation than the regular squared regions of traditional histograms.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 164}, {"topic": "Proportional Ink & 2D", "q": "It is always possible to create density contours to visualize a large number of distributions of very large data sets, and to overplot them in the same figure.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 165}, {"topic": "Proportional Ink & 2D", "q": "Human perception is equally good at judging distances and areas.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 166}, {"topic": "Proportional Ink & 2D", "q": "One technique to deal with overlapping points that works for any number of points is to use transparency.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 167}, {"topic": "Proportional Ink & 2D", "q": "To handle overlapping points you can always use jittering, and this is enough to solve overlaps for datasets of any size.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 168}, {"topic": "Proportional Ink & 2D", "q": "Overplotting only happens with very large datasets; it never occurs in smaller datasets (e.g. a few tens of points).", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 169}, {"topic": "Proportional Ink & 2D", "q": "When creating a log-scale visualization of ratios, you can start the drawings (e.g. of a bar chart) from zero.", "options": [["True", false], ["False", true]], "type": "single", "img": null, "id": 170}, {"topic": "Proportional Ink & 2D", "q": "Violations of the principle of proportional ink are always intentional.", "options": [["True", false], ["False", true]], "type": const QS = DATA.questions, IMG = DATA.images;
const KEY = "infoviz_practice_v1";

// ---- shuffle option order once per question (stable for session) ----
function shuffleInPlace(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
QS.forEach(q=>{
  q.opts = q.options.map((o,idx)=>({t:o[0], c:o[1], idx}));
  shuffleInPlace(q.opts);
});

// ---- state ----
let results = {};         // id -> 'correct' | 'wrong'
let selections = {};      // id -> array of chosen original idx
let locked = {};          // id -> true once checked
let order = [];           // ids in current deck order
let pos = 0;
let filterTopic = "ALL";
let filterMode = "all";

// persistence (best effort)
async function save(){
  const blob = {results, selections, locked};
  try{ if(window.storage){ await window.storage.set(KEY, JSON.stringify(blob), false);} }catch(e){}
}
async function load(){
  try{ if(window.storage){ const r = await window.storage.get(KEY); if(r&&r.value){const b=JSON.parse(r.value); results=b.results||{}; selections=b.selections||{}; locked=b.locked||{};} } }catch(e){}
}

const topics = ["ALL", ...Array.from(new Set(QS.map(q=>q.topic)))];

function buildTopicSelect(){
  const sel = document.getElementById('topic');
  sel.innerHTML = topics.map(t=>`<option value="${t}">${t==="ALL"?"All topics":t} (${t==="ALL"?QS.length:QS.filter(q=>q.topic===t).length})</option>`).join('');
  sel.value = filterTopic;
  sel.onchange = ()=>{ filterTopic=sel.value; rebuild(); };
}

function deckIds(){
  let list = QS.filter(q=> filterTopic==="ALL" || q.topic===filterTopic);
  if(filterMode==="wrong") list = list.filter(q=> results[q.id]==="wrong");
  else if(filterMode==="unseen") list = list.filter(q=> !(q.id in results));
  return list.map(q=>q.id);
}

function rebuild(){
  order = deckIds();
  pos = 0;
  render(); renderStats(); renderMap();
}

function qById(id){ return QS.find(q=>q.id===id); }

function render(){
  const stage = document.getElementById('stage');
  if(order.length===0){
    stage.innerHTML = `<div class="card done"><h2>Nothing here ✦</h2><p class="sub">No questions match this filter. Try a different topic or mode.</p></div>`;
    return;
  }
  const id = order[pos];
  const q = qById(id);
  const isMulti = q.type==='multi';
  const checked = !!locked[id];
  const chosen = selections[id] || [];

  let optHtml = q.opts.map(o=>{
    const isSel = chosen.includes(o.idx);
    let cls = "opt " + (isMulti?"check":"radio");
    let mark = isMulti ? (isSel?"✓":"") : (isSel?"●":"");
    let tag = "";
    if(checked){
      cls += " locked";
      if(o.c){ cls+=" correct"; mark="✓"; tag=`<span class="tag">correct</span>`; }
      else if(isSel){ cls+=" bad"; mark="✕"; tag=`<span class="tag">your pick</span>`; }
    } else if(isSel){ cls+=" sel"; }
    return `<div class="${cls}" data-oi="${o.idx}"><div class="mark">${mark}</div><div class="lab">${escapeHtml(o.t)}</div>${tag}</div>`;
  }).join('');

  const imgHtml = q.img ? `<img class="qimg" src="${IMG[q.img]}" alt="figure for this question">` : "";
  const typeLabel = isMulti ? "Select all that apply" : "Single answer";

  let verdict = "";
  if(checked){
    const ok = results[id]==='correct';
    verdict = `<div class="verdict ${ok?'ok':'no'}">${ok?'✓ Correct':'✕ Not quite — correct answer(s) highlighted in green'}</div>`;
  } else {
    verdict = `<div class="verdict"></div>`;
  }

  stage.innerHTML = `
   <div class="card">
     <div class="qhead">
       <span class="qnum">#${id} · ${pos+1}/${order.length}</span>
       <span class="badge">${q.topic}</span>
       <span class="badge type">${typeLabel}</span>
     </div>
     <div class="qtext">${escapeHtml(q.q)}</div>
     ${imgHtml}
     <div class="opts" id="opts">${optHtml}</div>
     <div class="foot">
       ${verdict}
       <div class="nav">
         <button class="btn ghost" id="prev">← Prev</button>
         ${checked ? `<button class="btn solid" id="next">Next →</button>`
                   : `<button class="btn solid" id="check">Check answer</button>`}
       </div>
     </div>
   </div>`;

  // option clicks
  if(!checked){
    document.querySelectorAll('#opts .opt').forEach(el=>{
      el.onclick = ()=>{
        const oi = parseInt(el.dataset.oi);
        let cur = selections[id] || [];
        if(isMulti){
          if(cur.includes(oi)) cur = cur.filter(x=>x!==oi); else cur=[...cur,oi];
        } else {
          cur = [oi];
        }
        selections[id]=cur; render();
      };
    });
    const cbtn = document.getElementById('check');
    if(cbtn) cbtn.onclick = ()=>checkAnswer(id);
  } else {
    const nb = document.getElementById('next'); if(nb) nb.onclick = ()=>{ if(pos<order.length-1){pos++;render();} else finish(); };
  }
  const pb = document.getElementById('prev'); if(pb) pb.onclick = ()=>{ if(pos>0){pos--;render();} };
  renderMap();
}

function checkAnswer(id){
  const q = qById(id);
  const chosen = (selections[id]||[]).slice().sort();
  if(chosen.length===0) return; // need a pick
  const correctIdx = q.options.map((o,i)=>o[1]?i:-1).filter(i=>i>=0).sort();
  const ok = chosen.length===correctIdx.length && chosen.every((v,i)=>v===correctIdx[i]);
  results[id] = ok?'correct':'wrong';
  locked[id]=true;
  save(); render(); renderStats();
}

function finish(){
  const stage=document.getElementById('stage');
  const ids = order;
  const c = ids.filter(i=>results[i]==='correct').length;
  const w = ids.filter(i=>results[i]==='wrong').length;
  stage.innerHTML = `<div class="card done">
    <h2>Deck complete ✦</h2>
    <p class="sub">${c} correct · ${w} wrong out of ${ids.length}.</p>
    <div class="controls" style="justify-content:center;margin-top:14px">
      <button class="btn solid" id="practice">Practice the ${w} I missed</button>
      <button class="btn" id="again">Review this deck again</button>
    </div></div>`;
  const p=document.getElementById('practice'); if(p) p.onclick=()=>{ document.querySelector('#mode button[data-m="wrong"]').click(); };
  const a=document.getElementById('again'); if(a) a.onclick=()=>{ pos=0; render(); };
}

function renderStats(){
  const ids = order.length? order : QS.map(q=>q.id);
  const all = QS.map(q=>q.id);
  const c = all.filter(i=>results[i]==='correct').length;
  const w = all.filter(i=>results[i]==='wrong').length;
  const total = (filterTopic==="ALL"&&filterMode==="all") ? QS.length : order.length;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-correct').textContent = c;
  document.getElementById('s-wrong').textContent = w;
  document.getElementById('s-left').textContent = QS.length - c - w;
  const ans = c+w;
  document.getElementById('bar').style.width = (100*ans/QS.length)+'%';
  document.getElementById('sub').textContent =
    `${QS.length} unique questions across ${topics.length-1} topics · ${ans} answered, ${QS.length-ans} to go.`;
}

function renderMap(){
  const map=document.getElementById('map');
  const curId = order[pos];
  map.innerHTML = order.map(id=>{
    let cls="cell"; if(results[id]==='correct')cls+=" c"; else if(results[id]==='wrong')cls+=" w";
    if(id===curId)cls+=" cur";
    return `<div class="${cls}" data-id="${id}" title="Question #${id}">${id}</div>`;
  }).join('');
  map.querySelectorAll('.cell').forEach(el=>{
    el.onclick=()=>{ pos=order.indexOf(parseInt(el.dataset.id)); render(); };
  });
}

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// mode buttons
document.querySelectorAll('#mode button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#mode button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); filterMode=b.dataset.m; rebuild();
  };
});
document.getElementById('shuffle').onclick=()=>{ shuffleInPlace(order); pos=0; render(); };
document.getElementById('reset').onclick=async ()=>{
  results={}; selections={}; locked={};
  try{ if(window.storage) await window.storage.delete(KEY);}catch(e){}
  rebuild();
};

document.getElementById('foot').innerHTML =
  "Built from your study guide — 174 unique questions, duplicates merged. Single-answer and select-all-that-apply both supported; "+
  "each wrong distractor was added for practice while every correct answer from the guide is preserved. "+
  "Where the source gave conflicting answers for the same figure (e.g. the spiky age histogram), the image-accurate answer was used. "+
  "Progress saves automatically in this browser session.";

(async function init(){
  await load();
  buildTopicSelect();
  rebuild();
})();
</script>
</body>
</html>
