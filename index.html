<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Information Visualization — Practice Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=JetBrains+Mono:wght@400;600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6;
    --bg-2: #ebe4d4;
    --ink: #1a1a1a;
    --muted: #6b6357;
    --accent: #c63d2f;
    --accent-2: #2b4d3b;
    --gold: #b8893a;
    --paper: #fbf8f1;
    --line: #d4ccb8;
    --green: #2b7a4b;
    --green-bg: #e3f1e7;
    --red: #b3261e;
    --red-bg: #f8e3e1;
    --blue: #1f5b8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter Tight', sans-serif;
    min-height: 100vh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      radial-gradient(circle at 10% 0%, rgba(198,61,47,0.06), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(43,77,59,0.05), transparent 40%);
    padding: 24px 18px 80px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--ink);
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: clamp(26px, 4.5vw, 42px);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }
  .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
    margin-top: 6px;
  }
  .stats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-align: right;
    color: var(--muted);
    line-height: 1.7;
  }
  .stats strong { color: var(--ink); font-size: 14px; }
  .stats .correct-stat { color: var(--green); }
  .stats .wrong-stat { color: var(--red); }

  .progress-wrap {
    height: 6px;
    background: var(--bg-2);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    width: 0%;
    transition: width 0.4s ease;
  }

  .card {
    position: relative;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 28px 28px 24px;
    box-shadow: 6px 6px 0 var(--ink);
    margin-bottom: 22px;
  }
  .card-tag {
    position: absolute;
    top: 14px;
    right: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card-tag .num { color: var(--ink); font-weight: 600; }

  .q-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
    display: inline-block;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 3px;
  }
  .q-label.multi { color: var(--blue); border-color: var(--blue); }
  .question {
    font-family: 'Fraunces', serif;
    font-size: clamp(17px, 2.4vw, 21px);
    line-height: 1.45;
    font-weight: 500;
    margin-bottom: 12px;
  }
  .multi-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--blue);
    background: #e7eff5;
    padding: 6px 10px;
    border-radius: 3px;
    display: inline-block;
    margin-bottom: 14px;
    letter-spacing: 0.05em;
  }

  .qimg {
    margin: 12px 0 18px;
    text-align: center;
    background: white;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .qimg img {
    max-width: 100%;
    max-height: 420px;
    height: auto;
    border-radius: 2px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 6px;
  }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 15px;
    line-height: 1.4;
    text-align: left;
    font-family: inherit;
    color: inherit;
    width: 100%;
  }
  .opt:hover:not(:disabled) {
    border-color: var(--ink);
    transform: translateX(2px);
    background: #fff;
  }
  .opt:disabled { cursor: default; }
  .opt .letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    background: var(--paper);
  }
  .opt .text { flex: 1; padding-top: 2px; }
  .opt.selected {
    border-color: var(--ink);
    background: #fff;
  }
  .opt.selected .letter {
    background: var(--ink);
    color: var(--paper);
  }
  .opt.correct {
    border-color: var(--green);
    background: var(--green-bg);
  }
  .opt.correct .letter {
    background: var(--green);
    color: white;
    border-color: var(--green);
  }
  .opt.incorrect {
    border-color: var(--red);
    background: var(--red-bg);
  }
  .opt.incorrect .letter {
    background: var(--red);
    color: white;
    border-color: var(--red);
  }
  .opt .mark {
    margin-left: auto;
    font-weight: 700;
    font-size: 18px;
    align-self: center;
  }
  .opt.correct .mark { color: var(--green); }
  .opt.incorrect .mark { color: var(--red); }

  .feedback {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 4px;
    font-size: 14px;
    display: none;
    animation: fadeUp 0.3s ease;
  }
  .feedback.show { display: block; }
  .feedback.right {
    background: var(--green-bg);
    border-left: 3px solid var(--green);
  }
  .feedback.wrong {
    background: var(--red-bg);
    border-left: 3px solid var(--red);
  }
  .feedback .fb-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .feedback.right .fb-title { color: var(--green); }
  .feedback.wrong .fb-title { color: var(--red); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  .controls-left, .controls-right {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  button {
    font-family: 'Inter Tight', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 11px 20px;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s ease;
    box-shadow: 3px 3px 0 var(--ink);
  }
  button:hover:not(:disabled) {
    transform: translate(-1px, -1px);
    box-shadow: 4px 4px 0 var(--ink);
  }
  button:active:not(:disabled) {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  button.primary { background: var(--ink); color: var(--paper); }
  button.accent { background: var(--accent); color: var(--paper); }
  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .toolbar {
    margin-top: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .toolbar button {
    box-shadow: 2px 2px 0 var(--ink);
    padding: 7px 12px;
    font-size: 11px;
  }
  .filter-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }

  .completion {
    margin-top: 40px;
    padding: 40px;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    text-align: center;
    box-shadow: 6px 6px 0 var(--accent);
    display: none;
  }
  .completion.show { display: block; }
  .completion h2 {
    font-family: 'Fraunces', serif;
    font-size: 36px;
    margin-bottom: 8px;
  }
  .completion .score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .completion .score strong { color: var(--green); font-size: 26px; }

  footer {
    margin-top: 30px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    .card { padding: 22px 18px 18px; }
    .card-tag { position: static; margin-bottom: 10px; display: block; }
    button { padding: 9px 14px; font-size: 12px; }
    .opt { padding: 12px 14px; font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <div class="brand">Information <em>Visualization</em></div>
      <div class="subtitle">Practice Quiz · Multiple Choice · All Topics</div>
    </div>
    <div class="stats">
      Q <strong id="curNum">1</strong> / <strong id="totalNum">0</strong><br>
      <span class="correct-stat">✓ <strong id="correctCt">0</strong></span> &nbsp;
      <span class="wrong-stat">✗ <strong id="wrongCt">0</strong></span>
    </div>
  </header>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <div class="card" id="card">
    <div class="card-tag">Question · <span class="num" id="cardId">001</span></div>
    <span class="q-label" id="qLabel">Question</span>
    <div class="question" id="questionText"></div>
    <div id="multiHint" style="display:none;" class="multi-hint">⚡ Select all that apply, then click Submit</div>
    <div id="imgWrap"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback">
      <div class="fb-title" id="fbTitle"></div>
      <div id="fbBody"></div>
    </div>
  </div>

  <div class="controls">
    <div class="controls-left">
      <button id="prevBtn">← Previous</button>
    </div>
    <div class="controls-right">
      <button id="submitBtn" class="primary">Submit</button>
      <button id="nextBtn" class="accent" disabled>Next →</button>
    </div>
  </div>

  <div class="toolbar">
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <span class="filter-label">Mode:</span>
      <button id="shuffleBtn">Shuffle</button>
      <button id="resetBtn">Reset Quiz</button>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="prevQBtn">⏮ First</button>
      <button id="lastQBtn">Last ⏭</button>
    </div>
  </div>

  <div class="completion" id="completion">
    <h2>Quiz complete!</h2>
    <div class="score">Final score: <strong id="finalScore">0</strong> / <span id="finalTotal">0</span></div>
    <button onclick="resetQuiz()" class="accent">Restart Quiz</button>
  </div>

  <footer>Click an option to select · Submit to check · Multi-select questions allow multiple choices</footer>
</div>

/* ============================================================
   APP LOGIC
   ============================================================ */
let order = QUESTIONS.map((_, i) => i);
let idx = 0;
let answered = {};   // questionIndex -> { selected: [], correct: bool }
let correctCount = 0;
let wrongCount = 0;
let currentSelection = [];

const $ = id => document.getElementById(id);
const card = $('card');

function arraysEqualUnordered(a, b) {
  if (a.length !== b.length) return false;
  const sa = [...a].sort((x,y)=>x-y);
  const sb = [...b].sort((x,y)=>x-y);
  return sa.every((v, i) => v === sb[i]);
}

function render() {
  const realIdx = order[idx];
  const q = QUESTIONS[realIdx];
  const prevAns = answered[realIdx];

  $('cardId').textContent = String(realIdx + 1).padStart(3, '0');
  $('curNum').textContent = idx + 1;
  $('totalNum').textContent = QUESTIONS.length;
  $('correctCt').textContent = correctCount;
  $('wrongCt').textContent = wrongCount;
  $('questionText').textContent = q.q;

  // Label
  if (q.type === 'multi') {
    $('qLabel').textContent = 'Multi-Select';
    $('qLabel').className = 'q-label multi';
    $('multiHint').style.display = 'inline-block';
  } else {
    $('qLabel').textContent = 'Question';
    $('qLabel').className = 'q-label';
    $('multiHint').style.display = 'none';
  }

  // Image
  if (q.img && typeof IMAGES !== 'undefined' && IMAGES[q.img]) {
    $('imgWrap').innerHTML = `<div class="qimg"><img src="${IMAGES[q.img]}" alt="visualization"></div>`;
  } else {
    $('imgWrap').innerHTML = '';
  }

  // Options
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
  currentSelection = prevAns ? [...prevAns.selected] : [];
  const optsHtml = q.options.map((opt, i) => {
    const sel = currentSelection.includes(i);
    return `<button class="opt${sel ? ' selected' : ''}" data-idx="${i}">
      <span class="letter">${letters[i]}</span>
      <span class="text">${escapeHtml(opt)}</span>
    </button>`;
  }).join('');
  $('options').innerHTML = optsHtml;

  // Attach handlers
  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectOption(parseInt(btn.dataset.idx)));
  });

  // Restore previous answer state
  if (prevAns) {
    showResult(q, prevAns.selected);
    $('submitBtn').disabled = true;
    $('submitBtn').textContent = 'Submitted';
  } else {
    $('submitBtn').disabled = currentSelection.length === 0;
    $('submitBtn').textContent = 'Submit';
    $('feedback').classList.remove('show');
  }

  // Nav buttons
  $('prevBtn').disabled = idx === 0;
  $('nextBtn').disabled = !prevAns && idx !== QUESTIONS.length - 1 ? !prevAns : (idx === QUESTIONS.length - 1);
  $('nextBtn').disabled = idx === QUESTIONS.length - 1;

  // Progress
  const pct = ((idx + 1) / QUESTIONS.length) * 100;
  $('progressBar').style.width = pct + '%';
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function selectOption(i) {
  const realIdx = order[idx];
  if (answered[realIdx]) return; // already submitted

  const q = QUESTIONS[realIdx];
  if (q.type === 'single') {
    currentSelection = [i];
  } else {
    if (currentSelection.includes(i)) {
      currentSelection = currentSelection.filter(x => x !== i);
    } else {
      currentSelection.push(i);
    }
  }
  // Update DOM
  document.querySelectorAll('.opt').forEach(btn => {
    const bi = parseInt(btn.dataset.idx);
    btn.classList.toggle('selected', currentSelection.includes(bi));
  });
  $('submitBtn').disabled = currentSelection.length === 0;
}

function submit() {
  const realIdx = order[idx];
  if (answered[realIdx]) return;
  const q = QUESTIONS[realIdx];
  if (currentSelection.length === 0) return;

  const isCorrect = arraysEqualUnordered(currentSelection, q.correct);
  answered[realIdx] = { selected: [...currentSelection], correct: isCorrect };
  if (isCorrect) correctCount++; else wrongCount++;
  $('correctCt').textContent = correctCount;
  $('wrongCt').textContent = wrongCount;

  showResult(q, currentSelection);
  $('submitBtn').disabled = true;
  $('submitBtn').textContent = 'Submitted';

  // Check completion
  if (Object.keys(answered).length === QUESTIONS.length) {
    $('finalScore').textContent = correctCount;
    $('finalTotal').textContent = QUESTIONS.length;
    $('completion').classList.add('show');
  }
}

function showResult(q, selected) {
  const isCorrect = arraysEqualUnordered(selected, q.correct);
  document.querySelectorAll('.opt').forEach(btn => {
    const bi = parseInt(btn.dataset.idx);
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectAns = q.correct.includes(bi);
    const wasSelected = selected.includes(bi);
    if (isCorrectAns) {
      btn.classList.add('correct');
      if (!btn.querySelector('.mark')) {
        btn.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
      }
    } else if (wasSelected) {
      btn.classList.add('incorrect');
      if (!btn.querySelector('.mark')) {
        btn.insertAdjacentHTML('beforeend', '<span class="mark">✗</span>');
      }
    }
  });

  const fb = $('feedback');
  fb.classList.add('show');
  if (isCorrect) {
    fb.classList.add('right');
    fb.classList.remove('wrong');
    $('fbTitle').textContent = 'Correct';
    $('fbBody').textContent = q.type === 'multi'
      ? 'You selected all correct options.'
      : 'Nice — that is the right answer.';
  } else {
    fb.classList.add('wrong');
    fb.classList.remove('right');
    $('fbTitle').textContent = 'Not Quite';
    const correctLabels = q.correct.map(i => ['A','B','C','D','E','F'][i]).join(', ');
    $('fbBody').innerHTML = `Correct answer${q.correct.length > 1 ? 's' : ''}: <strong>${correctLabels}</strong> (highlighted in green).`;
  }
}

function next() {
  if (idx < QUESTIONS.length - 1) { idx++; render(); }
}
function prev() { if (idx > 0) { idx--; render(); } }

function shuffle() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  idx = 0;
  render();
}

function resetQuiz() {
  order = QUESTIONS.map((_, i) => i);
  idx = 0;
  answered = {};
  correctCount = 0;
  wrongCount = 0;
  currentSelection = [];
  $('completion').classList.remove('show');
  render();
}

$('submitBtn').addEventListener('click', submit);
$('nextBtn').addEventListener('click', next);
$('prevBtn').addEventListener('click', prev);
$('shuffleBtn').addEventListener('click', shuffle);
$('resetBtn').addEventListener('click', resetQuiz);
$('prevQBtn').addEventListener('click', () => { idx = 0; render(); });
$('lastQBtn').addEventListener('click', () => { idx = QUESTIONS.length - 1; render(); });

// Keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { prev(); }
  else if (e.key === 'Enter') {
    if (!$('submitBtn').disabled) submit();
    else if (!$('nextBtn').disabled) next();
  }
  else if (/^[1-6]$/.test(e.key)) {
    const i = parseInt(e.key) - 1;
    const q = QUESTIONS[order[idx]];
    if (i < q.options.length) selectOption(i);
  }
});

render();
</script>
